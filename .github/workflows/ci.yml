name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Takumi Guard (Shisho) supply-chain proxy. The token is optional: without it
  # the proxy runs anonymously and still rejects blocked packages with 403.
  UV_INDEX_TAKUMI_GUARD_USERNAME: token
  UV_INDEX_TAKUMI_GUARD_PASSWORD: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  backend:
    name: backend (lint / types / tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  frontend:
    name: frontend (lint / tests / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.22.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Authenticate to Takumi Guard
        if: ${{ env.TAKUMI_GUARD_TOKEN != '' }}
        run: pnpm config set //npm.flatt.tech/:_authToken "$TAKUMI_GUARD_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

  actions-audit:
    name: workflow security (zizmor / pinact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: zizmor
        run: uvx zizmor --persona=regular .github/workflows

      - name: pinact (actions must be pinned to a commit SHA)
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"
