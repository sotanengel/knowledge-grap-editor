name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@latest
      - name: Run pinact
        run: pinact run

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - name: Install zizmor
        run: pip install zizmor
      - name: Run zizmor
        run: zizmor --persona regular .github/workflows/ci.yml

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - uses: actions/setup-python@0a5ea601913b187143ee2790908930c1dcb39959 # v5.1.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -v

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - uses: actions/setup-python@0a5ea601913b187143ee2790908930c1dcb39959 # v5.1.1
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check kg_mcp tests
      - name: Pytest
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c588b3c488d8b33617389d0a # v4.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630cc966e7f427a641691cf8e # v4.2.2
      - name: Build images
        run: docker compose build
