[project]
name = "kg-mcp"
version = "0.1.0"
description = "Knowledge Graph MCP Server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.1.0",
    "httpx>=0.28.0",
    "uvicorn>=0.32.0",
    "starlette>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_mcp"]
