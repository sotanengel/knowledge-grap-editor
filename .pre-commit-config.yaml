default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "3.5.0"

# Vendored vocabularies are third-party artefacts and must stay byte-identical
# to what their publishers ship, so no hook rewrites them.
exclude: ^backend/src/ontoforge/vocab/data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.19.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: pnpm --dir frontend exec prettier --write .
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md|html|yaml|yml)$
        exclude: ^frontend/pnpm-lock\.yaml$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: pnpm --dir frontend exec eslint --fix .
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
